name: Daily Morning Intelligence Scan (08:30 AM IST)

on:
  schedule:
    # 03:00 UTC = 08:30 AM IST (Indian Standard Time is UTC + 5:30)
    - cron: '0 3 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI / Mobile App

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scan-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Execute Morning Intelligence Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python backend/run_daily_scan.py

      - name: Commit and Push Updated Daily Briefing
        run: |
          git config --global user.name 'Executive-Briefing-Bot'
          git config --global user.email 'bot@executive-intelligence.internal'
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: Morning Sector Intelligence [$(date -u +'%Y-%m-%d %H:%M UTC')]" && git push)
